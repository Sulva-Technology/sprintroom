
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Invoked by pg_cron/pg_net with `Authorization: Bearer <CRON_SECRET>`, which is
# not a JWT. verify_jwt must stay off or the gateway rejects the call before the
# function's own CRON_SECRET check can run.
[functions.process-recurring-tasks]
enabled = true
verify_jwt = false
import_map = "./functions/process-recurring-tasks/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/process-recurring-tasks/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/process-recurring-tasks/*.html" ]

# Same as above: cron-authenticated via CRON_SECRET, not a JWT.
[functions.process-schedules]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-schedules/index.ts"

# Called hourly by a scheduler (pg_cron/pg_net or the dashboard scheduler), not
# by a signed-in user — auth is the CRON_SECRET bearer token, so JWT
# verification must stay off or every call is rejected before it runs.
[functions.rhythm-nudges]
enabled = true
verify_jwt = false
entrypoint = "./functions/rhythm-nudges/index.ts"
